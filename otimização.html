<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Otimização por Victor</title>
  <style>
    body {
      background: linear-gradient(to right, #0f0f0f, #1c1c1c);
      color: #fff;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 50px;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      color: #b84cf3;
      font-size: 32px;
      margin-bottom: 10px;
      animation: slideIn 1s ease-out;
    }

    h2 {
      color: #6f00ff;
      margin-top: 0;
      font-size: 20px;
      font-weight: normal;
      animation: slideIn 1s ease-out 0.5s;
    }

    .botao {
      background-color: #8a2be2;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 40px;
      transition: 0.3s;
      animation: bounceIn 1s ease-out;
    }

    .botao:hover {
      background-color: #a350ff;
    }

    .progresso {
      width: 100%;
      max-width: 400px;
      height: 20px;
      background-color: #333;
      border-radius: 10px;
      margin: 30px auto;
      overflow: hidden;
      display: none;
    }

    .progresso-barra {
      height: 100%;
      width: 0;
      background-color: #b84cf3;
      transition: width 0.3s;
    }

    .mensagem-final {
      display: none;
      margin-top: 40px;
      font-size: 20px;
      border: 2px solid #8a2be2;
      border-radius: 10px;
      padding: 20px;
      color: #b84cf3;
      animation: fadeIn 2s ease-in-out;
    }

    .loading {
      font-size: 18px;
      color: #ffb84c;
      display: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes bounceIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      50% {
        transform: translateY(20px);
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

  </style>
</head>
<body>
  <h1>Script de Otimização</h1>
  <h2>Feito por: !ღ [𝑽]𝒊𝒄𝒕𝒐𝒓</h2>

  <div class="loading" id="loading">A otimização está sendo realizada...</div>

  <button class="botao" onclick="iniciarOtimizacao()">Iniciar Otimização</button>

  <div class="progresso">
    <div class="progresso-barra" id="barra"></div>
  </div>

  <div class="mensagem-final" id="mensagem">
    <p>💜 Otimização concluída com sucesso!</p>
    <p>Seu dispositivo está mais leve agora.<br>Obrigado por usar o script de !ღ [𝑽]𝒊𝒄𝒕𝒐𝒓!</p>
  </div>

  <script>
    function iniciarOtimizacao() {
      document.getElementById("loading").style.display = "block";
      document.querySelector(".progresso").style.display = "block";
      const barra = document.getElementById("barra");
      let progresso = 0;

      const intervalo = setInterval(() => {
        progresso += 1;
        barra.style.width = progresso + "%";

        if (progresso >= 100) {
          clearInterval(intervalo);
          document.getElementById("mensagem").style.display = "block";
          document.getElementById("loading").style.display = "none";
        }
      }, 50);
    }
  </script>

  <!-- Integração Crisp -->
  <script type="text/javascript">
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "d10b6cef-e810-4501-a723-8c313e365023";
    (function() {
      var d = document;
      var s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>
</body>
</html>
